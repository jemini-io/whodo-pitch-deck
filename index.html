<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhoDo Pitch Deck</title>
  <!-- Arrows move. F is fullscreen. S opens speaker notes. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fustat@5.3.0/latin-500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fustat@5.3.0/latin-700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fustat@5.3.0/latin-800.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css">
  <link rel="stylesheet" href="css/deck.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <section>
        <div class="frame gradient center">
          <h1>WhoDo</h1>
          <p class="by">Pitch deck</p>
        </div>
        <aside class="notes">
          <ul>
            <li>Opening line goes here.</li>
          </ul>
        </aside>
      </section>

      <section>
        <div class="frame light split">
          <div class="copy">
            <h2>Slide with copy and art</h2>
            <ul>
              <li>Point one</li>
              <li>Point two</li>
            </ul>
          </div>
          <div class="art">
            <!-- <img src="images/example.jpg" alt="Describe the image"> -->
          </div>
        </div>
        <aside class="notes">
          <ul>
            <li>Notes for this slide.</li>
          </ul>
        </aside>
      </section>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      width: 1920,
      height: 1080,
      margin: 0,
      minScale: 0.2,
      maxScale: 2.0,
      controls: false,
      progress: true,
      slideNumber: false,
      transition: "fade",
      transitionSpeed: "fast",
      backgroundTransition: "fade",
      center: false,
      plugins: [RevealNotes]
    });
  </script>
</body>
</html>
